name: Bug Report
description: Report a reproducible bug or unexpected behaviour
labels: ["bug", "triage"]
assignees: ["jcrvz"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
      placeholder: "When I call `optimiser.run(...)` with `operator_mode='nm_dual'`, it raises..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example
      description: Paste the smallest code snippet that triggers the bug.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Paste the full traceback if available.
      render: text

  - type: input
    id: version
    attributes:
      label: NEVO version
      placeholder: "0.1.1  (run `python -c 'import nevo; print(nevo.__version__)'`)"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 22.04 / macOS 14 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Any other context, screenshots, or related issues.

